<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lila" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a8f0"/>
      <stop offset="100%" stop-color="#8e5fc7"/>
    </linearGradient>
  </defs>
  <!-- Círculo exterior -->
  <circle cx="256" cy="256" r="250" fill="url(#lila)"/>
  <!-- Anillo decorativo -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#f6ecfd" stroke-width="8"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#f6ecfd" stroke-width="2" opacity="0.7"/>
  <!-- Iniciales -->
  <text x="256" y="300" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="170" font-weight="bold" fill="#ffffff"
        letter-spacing="4">L.C.</text>
  <!-- Línea decorativa -->
  <line x1="166" y1="336" x2="346" y2="336" stroke="#fddde9" stroke-width="5" stroke-linecap="round"/>
  <!-- Nombre pequeño -->
  <text x="256" y="378" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" fill="#f6ecfd" letter-spacing="6">LIBRERÍA CASTRO</text>
</svg>
